version: '3.8'
networks:
  online-boutique-network:
    driver: bridge

services:
  adservice:
    build:
      context: ./src/adservice
      dockerfile: Dockerfile
    container_name: ad_service
    ports:
      - "9555:9555"
      env:
        
    networks:
      - online-boutique-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9555"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s



  cartservice:
    build:
      context: ./src/cartservice/src
      dockerfile: Dockerfile
    container_name: cart_service
    ports:
      - "7070:7070"
    networks:
