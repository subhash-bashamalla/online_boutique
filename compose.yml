version: '3.8'
networks:
  online-boutique-network:
    driver: bridge

services:
  adservice:
    build:
      context: ./src/adservice
      dockerfile: Dockerfile
    container_name: ad_service
    ports:
      - "9555:9555"
    environment:
      PORT: "9555" 
    networks:
      - online-boutique-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9555"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s



  cartservice:
    build:
      context: ./src/cartservice/src
      dockerfile: Dockerfile
    container_name: cart_service
    ports:
      - "7070:7070"
    environment:
      REDIS_ADDR: "cartservice:9555"
    networks:
      - online-boutique-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7070"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s



  checkoutservice:
    build:
      context: ./src/checkoutservice
      dockerfile: Dockerfile
    container_name: checkout_service
    ports:
      - "5050:5050"
    environment:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      PAYMENT_SERVICE_ADDR: "paymentservice:50051"
      EMAIL_SERVICE_ADDR: "emailservice:5000"
      CART_SERVICE_ADDR: "cartservice:7070"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
    networks:
      - online-boutique-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5050"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  currencyservice:
    build:
      context: ./src/currencyservice
      dockerfile: Dockerfile
    container_name: currency_service
    ports:
      - "7000:7000"
    environment:
      PORT: "7000"
      DISABLE_PROFILER: "1"
    networks:
      - online-boutique-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  emailservice:
    build:
      context: ./src/emailservice
      dockerfile: Dockerfile
    container_name: email_service
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DISABLE_PROFILER: "1"
    networks:
      - online-boutique-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      RECOMMENDATION_SERVICE_ADDR: "paymentservice:8080"
      CHECKOUT_SERVICE_ADDR: "checkoutservice:5050"
      CART_SERVICE_ADDR: "cartservice:7070"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      AD_SERVICE_ADDR: "adservice:9555"
      SHOPPING_ASSISTANT_SERVICE_ADDR: "shoppingassistantservice:80"
      ENABLE_PROFILER: "0"
    networks:
      - online-boutique-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  loadgenerator:
    build:
      context: ./src/loadgenerator
      dockerfile: Dockerfile
    container_name: load_generator
    ports:
      - "9555:9555"
    environment:
      FRONTEND_ADDR: "frontend:80"
    networks:
      - online-boutique-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9555"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  paymentservice:
    build:
      context: ./src/paymentservice
      dockerfile: Dockerfile
    container_name: payment_service
    ports:
      - "50051:50051"
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"
    networks:
      - online-boutique-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  productcatalogservice:
    build:
      context: ./src/productcatalogservice
      dockerfile: Dockerfile
    container_name: productcatalog_service
    ports:
      - "3550:3550"
    environment:
      PORT: "3550"
      DISABLE_PROFILER: "1"
    networks:
      - online-boutique-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3550"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  recommendationservice:
    build:
      context: ./src/recommendationservice
      dockerfile: Dockerfile
    container_name: recommendation_service
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DISABLE_PROFILER: "1"
      PRODUCT_CATALOG_SERVICE: "productcatalogservice:3550"
    networks:
      - online-boutique-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  shippingservice:
    build:
      context: ./src/shippingservice
      dockerfile: Dockerfile
    container_name: shipping_service
    ports:
      - "50051:50051"
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"
    networks:
      - online-boutique-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      REDIS_ADDR: "redis:6379"
    restart: unless-stopped
    networks:
      - online-boutique-network
    volumes:
      - redis-data:/data



volumes:
   redis-data:
